<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="600" fill="white"/>

  <!-- Title -->
  <text x="475" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Unity Module Architecture</text>

  <!-- Core Gameplay Group -->
  <rect x="20" y="50" width="280" height="200" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="160" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Core Gameplay</text>

  <rect x="40" y="90" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">GameManager</text>

  <rect x="160" y="90" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="210" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">FishSpawner</text>

  <rect x="40" y="145" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="90" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">FishMovement</text>

  <rect x="160" y="145" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="210" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">FishCatcher</text>

  <rect x="100" y="200" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="150" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">PauseMenu</text>
  <text x="150" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Controller</text>

  <!-- Input Group -->
  <rect x="330" y="50" width="280" height="200" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="470" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Input Modules</text>

  <rect x="350" y="90" width="110" height="40" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="405" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ClickDetector</text>

  <rect x="480" y="90" width="110" height="40" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="535" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">HandTracking</text>
  <text x="535" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Catcher</text>

  <rect x="350" y="145" width="110" height="40" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="405" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">GameHand</text>
  <text x="405" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">LandmarkerRunner</text>

  <rect x="480" y="145" width="110" height="40" rx="4" fill="#fff8e1" stroke="#ffa000" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="535" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">MediaPipe</text>
  <text x="535" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">(External)</text>

  <!-- Analytics & Network Group -->
  <rect x="640" y="50" width="290" height="200" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="785" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Analytics &amp; Network</text>

  <rect x="660" y="90" width="110" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="715" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">SessionStats</text>

  <rect x="660" y="145" width="110" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="715" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">GameSettings</text>
  <text x="715" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Manager</text>

  <rect x="790" y="90" width="120" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="850" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">SessionUploader</text>

  <rect x="790" y="145" width="120" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="850" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">AudioManager</text>

  <!-- Data Layer -->
  <rect x="20" y="280" width="280" height="100" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="160" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Data Models</text>

  <rect x="50" y="320" width="90" height="40" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="95" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">FishData</text>

  <rect x="160" y="320" width="100" height="40" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="210" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">GameSettings</text>

  <!-- UI Layer -->
  <rect x="330" y="280" width="280" height="100" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="470" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">UI (UI Toolkit)</text>

  <rect x="350" y="320" width="80" height="40" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="390" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Login/Reg</text>

  <rect x="450" y="320" width="70" height="40" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="485" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Settings</text>

  <rect x="540" y="320" width="60" height="40" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="570" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Pause</text>

  <!-- External Systems -->
  <rect x="640" y="280" width="290" height="100" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="785" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">External Systems</text>

  <rect x="670" y="320" width="110" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="725" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Flask Backend</text>

  <rect x="800" y="320" width="110" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="855" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">MongoDB</text>

  <!-- Connection Lines - All routed AROUND boxes, not through them -->

  <!-- GameManager to FishSpawner (horizontal, inside Core group) -->
  <line x1="140" y1="110" x2="155" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FishSpawner creates FishMovement (down-left path, stays inside Core group) -->
  <path d="M 210 130 L 210 137 L 90 137 L 90 145" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ClickDetector to FishCatcher: exit LEFT through gap between groups -->
  <path d="M 350 110 L 310 110 L 310 165 L 260 165" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HandTrackingCatcher to FishCatcher: exit RIGHT, go around outside, then left -->
  <path d="M 590 110 L 620 110 L 620 260 L 235 260 L 235 185" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FishCatcher to SessionStats (path goes above all groups) -->
  <path d="M 260 165 L 315 165 L 315 40 L 715 40 L 715 85" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SessionStats to SessionUploader (horizontal inside Analytics group) -->
  <line x1="770" y1="110" x2="785" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GameSettingsManager to Backend (dashed, vertical path through gap) -->
  <path d="M 715 185 L 715 265 L 725 265 L 725 315" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>

  <!-- SessionUploader to Backend: exit RIGHT to avoid AudioManager, then down and left -->
  <path d="M 910 110 L 935 110 L 935 265 L 775 265 L 775 315" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>

  <!-- Legend -->
  <rect x="20" y="410" width="910" height="170" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="475" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Legend</text>

  <!-- Legend items - Row 1 -->
  <line x1="50" y1="470" x2="90" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="474" font-family="Arial, sans-serif" font-size="10" fill="#333">Direct dependency</text>

  <line x1="300" y1="470" x2="340" y2="470" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <text x="350" y="474" font-family="Arial, sans-serif" font-size="10" fill="#333">Network call</text>

  <!-- Legend items - Row 2 -->
  <rect x="50" y="500" width="20" height="15" rx="2" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="80" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">Core Gameplay</text>

  <rect x="200" y="500" width="20" height="15" rx="2" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="230" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">Input</text>

  <rect x="300" y="500" width="20" height="15" rx="2" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="330" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">Analytics/Network</text>

  <rect x="500" y="500" width="20" height="15" rx="2" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="530" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">Data Models</text>

  <rect x="650" y="500" width="20" height="15" rx="2" fill="#e0f7fa" stroke="#00838f" stroke-width="1"/>
  <text x="680" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">UI</text>

  <rect x="750" y="500" width="20" height="15" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="1" stroke-dasharray="3,1"/>
  <text x="780" y="512" font-family="Arial, sans-serif" font-size="10" fill="#333">External</text>

  <!-- Key flows note -->
  <text x="475" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Key data flow: Input modules → FishCatcher → SessionStats → SessionUploader → Backend</text>
</svg>
